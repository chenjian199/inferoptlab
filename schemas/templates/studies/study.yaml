schema_version: 0.2.0
kind: RecipeTemplate
id: template-studies-study
version: 1.0.0
title: StudySpec 创建模板
provenance: []
issues: []
extensions: {}
target_kind: StudySpec
parameters:
  id:
    type: string
    description: id；字段约束以对应 JSON Schema 为准。
  version:
    type: string
    description: version；字段约束以对应 JSON Schema 为准。
    default: 1.0.0
  title:
    type: string
    description: title；字段约束以对应 JSON Schema 为准。
  provenance:
    type: array
    description: provenance；字段约束以对应 JSON Schema 为准。
    default: []
  issues:
    type: array
    description: issues；字段约束以对应 JSON Schema 为准。
    default: []
  extensions:
    type: object
    description: extensions；字段约束以对应 JSON Schema 为准。
    default: {}
  model_ref:
    type: object
    description: model_ref；字段约束以对应 JSON Schema 为准。
  hardware_ref:
    type: object
    description: hardware_ref；字段约束以对应 JSON Schema 为准。
  runtime_ref:
    type: object
    description: runtime_ref；字段约束以对应 JSON Schema 为准。
  case_refs:
    type: array
    description: case_refs；字段约束以对应 JSON Schema 为准。
  allowed_deployment_modes:
    type: array
    description: allowed_deployment_modes；字段约束以对应 JSON Schema 为准。
  budget:
    type: object
    description: budget；字段约束以对应 JSON Schema 为准。
  capability_policy:
    type: string
    description: capability_policy；字段约束以对应 JSON Schema 为准。
  objective:
    type:
    - object
    - 'null'
    default: null
    description: objective；草案允许null，冻结检查决定是否必填。
body:
  schema_version: 0.2.0
  kind: StudySpec
  id:
    $param: id
  version:
    $param: version
  title:
    $param: title
  provenance:
    $param: provenance
  issues:
    $param: issues
  extensions:
    $param: extensions
  model_ref:
    $param: model_ref
  hardware_ref:
    $param: hardware_ref
  runtime_ref:
    $param: runtime_ref
  case_refs:
    $param: case_refs
  allowed_deployment_modes:
    $param: allowed_deployment_modes
  objective:
    $param: objective
  budget:
    $param: budget
  capability_policy:
    $param: capability_policy
