schema_version: 0.2.0
kind: RecipeTemplate
id: template-hardware-inspected
version: 1.0.0
title: 实机硬件检查配方
provenance: []
issues: []
extensions: {}
target_kind: HardwareSpec
parameters:
  id:
    type: string
    description: 配方的稳定标识；在整个配方库中与版本共同唯一。
  version:
    type: string
    description: 配方版本；引用方通过 id 和 version 精确定位。
  title:
    type: string
    description: 便于阅读的配方名称，说明对象和观测用途。
  provenance:
    type: array
    description: 来源文档引用及原文件中的定位信息。
  issues:
    type: array
    description: 未确认、冲突或缺失事项及其是否阻止冻结。
  extensions:
    type: object
    description: 带命名空间的扩展信息，保留标准字段之外的必要事实。
  evidence_level:
    type: string
    description: 证据等级；区分资料声明、实机检查和实测结果。
  profile_type:
    type: string
    description: 资源层级；区分设备规格与集群资源清单。
  vendor:
    type: string
    description: 硬件厂商名称。
  product:
    type: string
    description: 产品型号或实机资源名称。
  specifications:
    type: array
    description: 带单位、条件和证据定位的硬件参数。
  interfaces:
    type: array
    description: 接口类型、速率及对应的观测条件。
  capabilities:
    type: array
    description: 已经验证或尚未验证的能力、验证范围与证据引用。
  resources:
    type: object
    description: 节点、CPU、内存、设备和互联资源的实机清单。
  discovery:
    type: object
    description: 采集时间、主机、可用性、健康状态、拓扑与限制。
body:
  schema_version: 0.2.0
  kind: HardwareSpec
  id:
    $param: id
  version:
    $param: version
  title:
    $param: title
  provenance:
    $param: provenance
  issues:
    $param: issues
  extensions:
    $param: extensions
  evidence_level:
    $param: evidence_level
  profile_type:
    $param: profile_type
  vendor:
    $param: vendor
  product:
    $param: product
  specifications:
    $param: specifications
  interfaces:
    $param: interfaces
  capabilities:
    $param: capabilities
  resources:
    $param: resources
  discovery:
    $param: discovery
