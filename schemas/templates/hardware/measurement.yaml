schema_version: 0.2.0
kind: RecipeTemplate
id: template-hardware-measurement
version: 1.0.0
title: 硬件性能测量配方
provenance: []
issues: []
extensions: {}
target_kind: HardwareMeasurement
parameters:
  id:
    type: string
    description: 配方的稳定标识；在整个配方库中与版本共同唯一。
  version:
    type: string
    description: 配方版本；引用方通过 id 和 version 精确定位。
  title:
    type: string
    description: 便于阅读的配方名称，说明对象和观测用途。
  provenance:
    type: array
    description: 来源文档引用及原文件中的定位信息。
  issues:
    type: array
    description: 未确认、冲突或缺失事项及其是否阻止冻结。
  extensions:
    type: object
    description: 带命名空间的扩展信息，保留标准字段之外的必要事实。
  hardware_ref:
    type: object
    description: 本次测量所针对的硬件配方及其版本。
  runtime_ref:
    type: object
    description: 本次测量使用的运行环境配方及其版本。
  captured_at:
    type: string
    description: 实际采集时间，使用带时区的时间戳。
  device_ids:
    type: array
    description: 参与测量的具体设备标识，须能关联硬件清单。
  evidence_kind:
    type: string
    description: 测量证据类别；明确结果来自实测还是其他来源。
  isolation:
    type: string
    description: 测试隔离程度，说明是否仅做空闲预检查。
  timer:
    type: string
    description: 计时接口及计时口径。
  measurements:
    type: array
    description: 测项、形状、精度、预热、原始耗时样本、统计量及计算公式。
  limitations:
    type: array
    description: 测量范围、未覆盖能力和不可推广的结论。
body:
  schema_version: 0.2.0
  kind: HardwareMeasurement
  id:
    $param: id
  version:
    $param: version
  title:
    $param: title
  provenance:
    $param: provenance
  issues:
    $param: issues
  extensions:
    $param: extensions
  hardware_ref:
    $param: hardware_ref
  runtime_ref:
    $param: runtime_ref
  captured_at:
    $param: captured_at
  device_ids:
    $param: device_ids
  evidence_kind:
    $param: evidence_kind
  isolation:
    $param: isolation
  timer:
    $param: timer
  measurements:
    $param: measurements
  limitations:
    $param: limitations
