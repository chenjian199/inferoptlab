schema_version: 0.2.0
kind: RecipeTemplate
id: template-runtimes-runtime
version: 1.0.0
title: RuntimeSpec 创建模板
provenance: []
issues: []
extensions: {}
target_kind: RuntimeSpec
parameters:
  id:
    type: string
    description: id；字段约束以对应 JSON Schema 为准。
  version:
    type: string
    description: version；字段约束以对应 JSON Schema 为准。
    default: 1.0.0
  title:
    type: string
    description: title；字段约束以对应 JSON Schema 为准。
  provenance:
    type: array
    description: provenance；字段约束以对应 JSON Schema 为准。
    default: []
  issues:
    type: array
    description: issues；字段约束以对应 JSON Schema 为准。
    default: []
  extensions:
    type: object
    description: extensions；字段约束以对应 JSON Schema 为准。
    default: {}
  engine:
    type: string
    description: engine；字段约束以对应 JSON Schema 为准。
  version_label:
    type: string
    description: version_label；字段约束以对应 JSON Schema 为准。
  libraries:
    type: object
    description: libraries；字段约束以对应 JSON Schema 为准。
  launch_parameters:
    type: object
    description: launch_parameters；字段约束以对应 JSON Schema 为准。
  status:
    type: string
    description: status；字段约束以对应 JSON Schema 为准。
  source_commit:
    type:
    - string
    - 'null'
    default: null
    description: source_commit；草案允许null，冻结检查决定是否必填。
  container_digest:
    type:
    - string
    - 'null'
    default: null
    description: container_digest；草案允许null，冻结检查决定是否必填。
  driver:
    type:
    - string
    - 'null'
    default: null
    description: driver；草案允许null，冻结检查决定是否必填。
  device_runtime:
    type:
    - string
    - 'null'
    default: null
    description: device_runtime；草案允许null，冻结检查决定是否必填。
  compiler:
    type:
    - string
    - 'null'
    default: null
    description: compiler；草案允许null，冻结检查决定是否必填。
body:
  schema_version: 0.2.0
  kind: RuntimeSpec
  id:
    $param: id
  version:
    $param: version
  title:
    $param: title
  provenance:
    $param: provenance
  issues:
    $param: issues
  extensions:
    $param: extensions
  engine:
    $param: engine
  version_label:
    $param: version_label
  source_commit:
    $param: source_commit
  container_digest:
    $param: container_digest
  driver:
    $param: driver
  device_runtime:
    $param: device_runtime
  compiler:
    $param: compiler
  libraries:
    $param: libraries
  launch_parameters:
    $param: launch_parameters
  status:
    $param: status
