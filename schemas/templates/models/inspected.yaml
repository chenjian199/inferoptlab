schema_version: 0.2.0
kind: RecipeTemplate
id: template-models-inspected
version: 1.0.0
title: 实机模型检查配方
provenance: []
issues: []
extensions: {}
target_kind: ModelSpec
parameters:
  id:
    type: string
    description: 配方的稳定标识；在整个配方库中与版本共同唯一。
  version:
    type: string
    description: 配方版本；引用方通过 id 和 version 精确定位。
  title:
    type: string
    description: 便于阅读的配方名称，说明对象和观测用途。
  provenance:
    type: array
    description: 来源文档引用及原文件中的定位信息。
  issues:
    type: array
    description: 未确认、冲突或缺失事项及其是否阻止冻结。
  extensions:
    type: object
    description: 带命名空间的扩展信息，保留标准字段之外的必要事实。
  evidence_level:
    type: string
    description: 证据等级；区分资料声明、实机检查和实测结果。
  identity:
    type: object
    description: 模型名称、家族、变体、上游版本和权重身份；未知值保持为空。
  tokenizer:
    type: object
    description: 分词器版本、文件哈希和聊天模板哈希。
  semantics:
    type: object
    description: 正确性与模型质量的验收策略引用。
  architecture:
    type: object
    description: 从配置核验的模型结构、层数、注意力、MoE 和状态信息。
  precision:
    type: object
    description: 权重、激活、KV cache 精度及实际量化方法和例外。
  checkpoint:
    type: object
    description: 权重路径、配置与索引指纹、分片和 tensor 存储及加载兼容性检查。
body:
  schema_version: 0.2.0
  kind: ModelSpec
  id:
    $param: id
  version:
    $param: version
  title:
    $param: title
  provenance:
    $param: provenance
  issues:
    $param: issues
  extensions:
    $param: extensions
  evidence_level:
    $param: evidence_level
  identity:
    $param: identity
  tokenizer:
    $param: tokenizer
  semantics:
    $param: semantics
  architecture:
    $param: architecture
  precision:
    $param: precision
  checkpoint:
    $param: checkpoint
