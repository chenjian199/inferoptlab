issues:
- code: truncated-throughput-heading
  path: /columns
  reason: 吞吐量表头被截断，保留源值，不改写为独立复测口径。
  blocking: false
  status: cropped
- code: unidentified-supernode
  path: /hardware_refs
  reason: fp8-超节点未明确具体型号，不自动等同于汇总表中的BW1301。
  blocking: false
  status: ambiguous
- code: cross-platform-configurations
  path: /extensions
  reason: H20为IFB、DCU为PD分离；KV精度与配置不同，不视为受控公平对比。
  blocking: false
  status: ambiguous
extensions:
  source.platform_settings:
    h20-141g:
      mode: IFB
      tp: 8
      ep: 8
      mem_fraction_static: 0.85
      kv_cache_dtype: bfloat16
      speculative_algorithm: EAGLE
      dsa_prefill_backend: tilelang
