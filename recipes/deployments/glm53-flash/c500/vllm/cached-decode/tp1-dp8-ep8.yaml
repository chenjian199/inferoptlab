schema_version: 0.2.0
kind: DeploymentSpec
id: glm53-vllm-cached-decode-tp1-dp8-ep8
version: 1.0.0
title: GLM Flash full-context cached Decode tp1-dp8-ep8
provenance: []
issues: []
extensions:
  measurement.scope: L cached context tokens plus one uncached P-produced seed. No
    P-to-D transfer is measured.
  startup.workspace: 4096-token startup profiling OOMs in MLA temporary workspace;
    use 1024. Scored Decode has at most 16 one-token queries per DP rank.
model_ref:
  id: cluster-glm53-flash-w8a8
  version: 1.1.0
hardware_ref:
  id: metax-four-node-inventory-metax-60-host
  version: 1.0.0
runtime_ref:
  id: metax60-vllm-glm53-cached-decode
  version: 1.0.0
mode: aggregated
prefix_cache: true
parallelism:
  tp: 1
  pp: 1
  dp: 8
  ep: 8
scheduling:
  chunked_prefill_tokens: null
  kv_page_tokens: null
  max_running_requests: 16
  max_num_batched_tokens: 1024
  max_model_len: 73728
  enable_chunked_prefill: true
serving:
