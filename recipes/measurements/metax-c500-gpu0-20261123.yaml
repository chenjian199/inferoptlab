limitations:
- '仅测量 GPU0，不代表 8 卡聚合性能。'
- 校准前后 GPU 进程清单为空；空闲检查不等同于测试全程具有系统级独占锁。
- FP16、BF16、FP32 GEMM 仅覆盖 M=N=K=4096 的 torch.mm，不能代表 W8A8 模型或其他形状的性能。
- device_copy 使用 256 MiB 设备内数据，按读写合计流量计带宽，不代表 H2D、D2H、PCIe 或 MetaXLink 带宽。
- 常量矩阵输出检查仅用于排除本次计算执行错误，不能替代模型质量评测。
- 未测 INT8 GEMM、跨卡通信或端到端 token 吞吐；这些指标需要独立实验。
