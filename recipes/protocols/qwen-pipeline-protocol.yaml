schema_version: 0.2.0
kind: MeasurementProtocol
id: qwen-pipeline-protocol
version: 1.0.0
title: Qwen pipeline qualification protocol
provenance: []
issues: []
extensions: {}
scope: e2e
method: full_request
allowed_deployment_modes:
- aggregated
timing:
  ttft_boundary: client_submit_to_first_content_token
  tpot_boundary: first_to_last_token_over_n_minus_one
  token_timestamps: unavailable
  window: fixed_request_set
  start: first_actual_send
  finish: last_completion_or_timeout
execution:
  warmup: Separate AIPerf process and disjoint warmup fixture; excluded from scoring.
  warmup_request_count: 1
  timeout_s: 120
  repetitions: 1
  profiler_during_scoring: false
accounting:
  primary_population: all_planned_requests
  failure_policy: retain_in_denominator
  logical_request_deduplication: true
steps:
- Check model and cache configuration.
- Run excluded warmup fixture.
- Send fixed request set with closed-loop concurrency.
- Retain failures and drain until completion or timeout.
